[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "QA_max_cut_lib"
dynamic = ["version"]
description = "Weighted Max-Cut research library: CPU solvers and exact reductions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
]

[project.optional-dependencies]
cpu = [
    "networkx>=3",
    "pandas>=2.1",
    "jsonschema>=4.21",
    "rich>=13",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "plotly>=5.20",
    "joblib>=1.3",
    "threadpoolctl>=3.2",
    "psutil>=5.9",
    "cvxpy>=1.4",
    "scs>=3.2",
    "dwave-samplers>=1.2",
    "dimod>=0.12",
    "python-louvain>=0.16",
]
notebooks = [
    "nbformat>=5",
    "nbclient>=0.9",
    "ipykernel>=6",
    "jupyterlab>=4",
]
gpu-cu12 = ["cupy-cuda12x[ctk]"]
gpu-cu13 = ["cupy-cuda13x[ctk]"]
dev = [
    "pytest>=8",
    "build>=1",
    "wheel",
]
docs = [
    "sphinx>=7",
    "numpydoc>=1.6",
    "pydata-sphinx-theme>=0.15",
    "myst-nb>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "QA_max_cut_lib._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
